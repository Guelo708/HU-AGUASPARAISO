<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Aguas Paraíso</title>
  <link rel="stylesheet" href="/css/registroUsuarios.css">
  <link rel="stylesheet" href="/css/home.css">
</head>
<body>
  <header>
    <nav class="navbar">
      <ul class="nav-menu">
        <li><a href="/html/home.html" class="active">Inicio</a></li>
        <li><a href="/html/usuarios.html">Usuarios</a></li>
        <li><a href="/html/pagos.html">Pagos</a></li>
        <li><a href="/html/factura.html">Facturas</a></li>
        <li><a href="/html/registroUsuarios.html" class="destacado">Registro Usuarios</a></li>
        <li><a href="/html/inicioSesion.html" class="destacado">Inicio de sesión</a></li>
      </ul>
    </nav>
  </header>
  <form id="registroForm">
    <label for="nombre">Nombre completo</label>
    <input type="text" id="nombre" name="nombre" placeholder="Nombre completo" required>

    <label for="email">Correo electrónico</label>
    <input type="email" id="email" name="email" placeholder="Correo electrónico" required>

    <label for="usuario">Usuario</label>
    <input type="text" id="usuario" name="usuario" placeholder="Nombre de usuario" required>

    <label for="password">Contraseña</label>
    <input type="password" id="password" name="password" placeholder="Contraseña" required>

    <button class="boton" type="button" id="btnRegistrarse">Registrarse</button>
  </form>

  <!-- Área de resultados -->
  <div id="resultados"></div>

  <script src="/javascript/registroUsuarios.js"></script>
</body>
</html>
