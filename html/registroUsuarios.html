  <link rel="stylesheet" href="/css/home.css">
</head>

<body>

    <nav class="navbar">
      <ul class="nav-menu">

        <!-- <li><a href="/html/inicioSesion.html" class="destacado">Inicio de sesión</a></li> -->
      </ul>
    </nav>
  </header>
  <div class="contenedor-registro">

    <h1 class="titulo-registro">
      Registro de Usuarios
    </h1>

    <form id="registroForm">
      <input type="hidden" id="idUsuario">

      <label for="nombre">Nombre completo</label>
      <input type="text" id="nombre" placeholder="Nombre completo" required>

      <label for="celular">Celular</label>
      <input type="text" id="celular" placeholder="Celular" required>

      <label for="email">Correo electrónico</label>
      <input type="email" id="email" placeholder="Correo electrónico" required>

    </form>

    <div class="botones">

      <button type="button" id="btnGuardar">
        Guardar
      </button>

      <button type="button" id="btnActualizar">
        Actualizar
      </button>

      <button type="button" id="btnEliminar">
        Eliminar
      </button>

    </div>
    <h2>Usuarios Registrados</h2>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Celular</th>
          <th>Correo</th>
          <th>Acciones</th>
        </tr>
      </thead>

      <tbody id="tablaUsuarios">

      </tbody>
    </table>
  </div>

  <script src="/javascript/registroUsuarios.js"></script>
</body>
